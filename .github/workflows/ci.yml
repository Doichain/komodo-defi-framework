name: CI (Linux)

# The only workflow this fork runs. The workflows inherited from upstream
# (release builds, multi-platform matrices) are disabled in the repository settings.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and Clippy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build deps
        uses: ./.github/actions/deps-install
        with:
          deps: ('protoc' 'libudev-dev')

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      # The toolchain comes from rust-toolchain.toml.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: fmt check
        run: cargo fmt -- --check

      - name: clippy lint
        run: cargo clippy --locked --all-targets --all-features -- --D warnings

  unit:
    name: Unit tests
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install build deps
        uses: ./.github/actions/deps-install
        with:
          deps: ('protoc')

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: unit-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Show toolchain
        run: rustc --version && cargo --version

      # Tests that need a public test network are listed in .github/ci-skip-tests.txt.
      - name: Test
        run: |
          skip=()
          while read -r name; do
            skip+=(--skip "$name")
          done < <(grep -v '^#' .github/ci-skip-tests.txt | grep -v '^$')
          echo "skipping $(( ${#skip[@]} / 2 )) tests"
          cargo test --locked --bins --lib --no-fail-fast -- "${skip[@]}"
